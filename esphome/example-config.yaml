# Example ESPHome configuration for Daikin Madoka
#
# Shows how to set up an ESP32 (for example an M5Stack Atom Lite) to drive
# Madoka BRC1H thermostats over Bluetooth Low Energy.

substitutions:
  name: m5stack-atom-lite-madoka
  friendly_name: Madoka BLE Proxy

# Base configuration for the M5Stack Atom Lite.
# Adjust it to your own ESP32 hardware.
packages:
  esphome.bluetooth-proxy: github://esphome/bluetooth-proxies/m5stack/m5stack-atom-lite.yaml@main

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Optional: verbose logs for debugging
logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

# The components live in a subfolder of the repository, so path: must be
# esphome/components. madoka_base has to be listed explicitly: AUTO_LOAD cannot
# reach a component that is not named here, and the build stops with
# "Component not found: madoka_base". Tags before v3.11.0 do not carry it.
#
# To work from a local copy instead, copy the repository's esphome/components
# folder into your ESPHome configuration directory and use:
#   - source:
#       type: local
#       path: components   # relative to your ESPHome config directory
#     components: [ madoka, madoka_base ]
external_components:
  - source:
      type: git
      url: https://github.com/dasimon135/daikin_madoka
      ref: v3.12.1        # replace with the latest tag
      path: esphome/components
    components: [ madoka, madoka_base ]

# Authenticated (MITM) pairing — MANDATORY for the BRC1H.
# The thermostat silently ignores every command sent over an unauthenticated
# link. It pairs by numeric comparison: both sides display a six-digit code and
# each confirms it matches. The default value (none) cannot take part in that,
# and keyboard offers passkey entry — a pairing model the thermostat never asks
# for. See also the on_numeric_comparison_request responder below: both are
# required.
esp32_ble:
  io_capability: display_yes_no

# ESP32 Bluetooth configuration
esp32_ble_tracker:
  id: ble_tracker       # required by the re-pairing switch further down
  max_connections: 2    # ESP32 hardware limit

# IMPORTANT: turn the ordinary Bluetooth proxy off,
# because we drive ble_client directly.
bluetooth_proxy:
  active: false

# One BLE client per thermostat
ble_client:
  # First thermostat
  - mac_address: "F0:B3:1E:87:AF:FE"  # replace with your own MAC address
    id: madoka_salon
    # Answers the thermostat's numeric comparison request. Without this block
    # pairing starts, nothing confirms it, and the connection fails with
    # AuthenticationCanceled — often with no prompt appearing on the
    # thermostat screen at all.
    on_numeric_comparison_request:
      then:
        - ble_client.numeric_comparison_reply:
            id: madoka_salon
            accept: true
    on_disconnect:
      then:
        # Reconnect automatically only while the proxy is enabled
        - if:
            condition:
              switch.is_on: proxy_enabled
            then:
              - ble_client.connect: madoka_salon

  # Second thermostat (optional)
  - mac_address: "1C:54:9E:90:E3:0E"  # replace with your own MAC address
    id: madoka_chambre
    on_numeric_comparison_request:
      then:
        - ble_client.numeric_comparison_reply:
            id: madoka_chambre
            accept: true
    on_disconnect:
      then:
        - if:
            condition:
              switch.is_on: proxy_enabled
            then:
              - ble_client.connect: madoka_chambre

# One climate entity per thermostat
climate:
  - platform: madoka
    name: "Madoka living room"
    ble_client_id: madoka_salon
    update_interval: 15s  # how often the state is polled
    # A single setpoint by default (standard BRC1H setup).
    # Set this to true ONLY if heat/cool range mode is enabled on the
    # thermostat: ESPHome climate traits are frozen at compile time, they
    # cannot follow the thermostat's own setting the way the HA integration does.
    # dual_setpoint: true
    outdoor_temperature:
      name: "Madoka living room outdoor temperature"
    clean_filter:
      name: "Madoka living room filter"
    firmware_version:
      name: "Madoka living room firmware"
    eye_brightness:
      name: "Madoka living room LED brightness"
    reset_filter:
      name: "Madoka living room filter reset"

  - platform: madoka
    name: "Madoka bedroom"
    ble_client_id: madoka_chambre
    update_interval: 15s
    outdoor_temperature:
      name: "Madoka bedroom outdoor temperature"
    clean_filter:
      name: "Madoka bedroom filter"
    firmware_version:
      name: "Madoka bedroom firmware"
    eye_brightness:
      name: "Madoka bedroom LED brightness"
    reset_filter:
      name: "Madoka bedroom filter reset"

# ---------------------------------------------------------------------------
# Switch that turns BLE off temporarily (re-pairing with the phone)
#
# Problem: when you clear every pairing on the Madoka to take control back with
# the phone app, the ESP32 reconnects in a loop and the phone can never pair.
#
# Fix: stop the BLE scan AND disconnect the clients explicitly from Home
# Assistant, do what you need with the phone, then switch it back on.
# ---------------------------------------------------------------------------
switch:
  - platform: template
    name: "Madoka proxy enabled"
    id: proxy_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - script.execute: start_ble
    turn_off_action:
      - script.execute: stop_ble

script:
  - id: stop_ble
    then:
      - logger.log: "BLE off - stopping the scan and disconnecting the thermostats"
      - lambda: |-
          id(ble_tracker).stop_scan();
      - ble_client.disconnect: madoka_salon
      - ble_client.disconnect: madoka_chambre

  - id: start_ble
    then:
      - logger.log: "BLE on - resuming the scan and reconnecting"
      - lambda: |-
          id(ble_tracker).start_scan();
      - ble_client.connect: madoka_salon
      - ble_client.connect: madoka_chambre

# Notes:
# 1. Each thermostat must be paired with the ESP32 before it can be used
# 2. Check the MAC addresses with 'bluetoothctl scan on'
# 3. Pin a released tag in 'ref:' — never point a deployed node at main
# 4. Both esp32_ble.io_capability and on_numeric_comparison_request are
#    required, or the thermostat connects and ignores every command

# ---------------------------------------------------------------------------
# Daikin VAM ventilation unit (heat recovery ventilation)
#
# A VAM is driven by the same BRC1H controller over the same BLE service, but
# it only ventilates (mode 5 = VENTILATION, no temperature setpoint).
# Use the dedicated 'madoka_vam' platform and add it to the
# 'external_components: components' list
# (for example: components: [ madoka, madoka_vam, madoka_base ]).
#
# Example (uncomment and set your own MAC address):
#
# ble_client:
#   - mac_address: "AA:BB:CC:DD:EE:FF"  # your VAM's MAC address
#     id: vam_client
#     on_numeric_comparison_request:
#       then:
#         - ble_client.numeric_comparison_reply:
#             id: vam_client
#             accept: true
#     on_disconnect:
#       then:
#         - ble_client.connect: vam_client
#
# climate:
#   - platform: madoka_vam
#     name: "VAM ventilation"
#     ble_client_id: vam_client
#     update_interval: 15s
#     firmware_version:
#       name: "VAM firmware"
#     dump_raw: false  # true = hex-log BLE frames (VAM reverse engineering)
# ---------------------------------------------------------------------------
